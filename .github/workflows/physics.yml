name: Physics Verification

# Ear-free implementation-conformance CI: rendered audio must match declared
# modal frequencies, amplitudes and T60.  This is not independent proof that
# model/material constants match a real instrument specimen.

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: windows-2022

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: tools/requirements-physics.txt

      - name: Install Python dependencies
        run: |
          python -m pip install pip==24.3.1
          python -m pip install -r tools/requirements-physics.txt

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTSUKI_BUILD_TESTS=ON

      - name: Build CLI (TsukiSynthCLI)
        run: cmake --build build --config Release --target TsukiSynthCLI

      - name: Build Standalone (TsukiSynth_Standalone)
        run: cmake --build build --config Release --target TsukiSynth_Standalone

      - name: Build VST3 (TsukiSynth_VST3)
        run: cmake --build build --config Release --target TsukiSynth_VST3

      - name: Build regression tests
        run: cmake --build build --config Release --target TsukiSynthAuditTest TsukiSynthTunerTest TsukiSynthPhysicsModelsTest

      - name: Run C++ audit and tuner regression tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run spectral and T60 metrology self-tests
        run: |
          python -m unittest tests/test_physics_verify.py -v
          python -m unittest tests/test_consonance_contract.py -v
          python -m unittest tests/test_verify_score_contract.py -v
          python -m unittest tests/test_specimen_verify.py -v
          python -m unittest tests/test_specimen_pipeline.py -v
          python tools/physics_verify.py --selftest

      - name: Run standalone T60 gate
        run: python tools/physics_verify.py --t60 --engines tongue_drum water_gong --notes 60

      - name: Run complete physics implementation gate (M1+M2+M5)
        # Phase E (2026-07-09) fixed the M2-2d theory predictor's decay-model
        # mismatch (tools/physics_verify.py synth_theory_signal(): `decay`
        # was being treated as a 1/e time constant when ModalResonator::
        # excite() defines it as T60 -- see MODAL_DECAY_LN1000 in that file).
        # --full covers note range, material implementation sensitivity,
        # velocity, one-to-one modal frequency/amplitude assignment, and
        # measured T60. Missing/model-audible partials and insufficient
        # coverage are exit-code-affecting; no weak/missing path is auto-PASS.
        run: python tools/physics_verify.py --full

      - name: Whole-score verification (CI smoke subset)
        # CI runs a fast cross-engine smoke subset only. The full 73-file
        # corpus (M3 GATE, `verify_score.py --all`) is a LOCAL release gate —
        # latest local four-shard run is documented in DEVLOG.md and
        # docs/DEEP_FIX_VERIFICATION_2026-07-17.zh-TW.md (73/73 passed,
        # 1 existing registered exemption, 0 failed, 2026-07-17). Rendering the
        # whole corpus twice (determinism check) would take hours on a 2-core
        # hosted runner; this smoke set still exercises schema / mode-scan /
        # rest / peak / determinism logic across the modal engine families.
        shell: pwsh
        run: |
          $smoke = @(
            "scores/originals/ai_radiance/ai_radiance_m1.score.json",
            "scores/originals/rules_v2_demo/rules_v2_demo_001.score.json",
            "scores/examples/akashic_bell.score.json",
            "scores/examples/water_gong_clamped.score.json",
            "scores/examples/water_gong_free.score.json",
            "scores/examples/physical_piano.score.json"
          )
          $fail = 0
          foreach ($s in $smoke) {
            python tools/verify_score.py $s
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          exit $fail

      - name: Run event-specific consonance gate
        run: >-
          python tools/check_piece_consonance.py
          scores/originals/rules_v2_demo/rules_v2_demo_001.score.json
          --out "${{ runner.temp }}\rules_v2_demo_consonance_check.md"

  # ---------------------------------------------------------------------
  # Cross-platform render reproducibility (TODO.md Verification gap:
  # "Establish cross-platform numerical reproducibility rules").
  #
  # Every documented GATE in reports/gate_outputs/ was produced by a
  # Windows/MSVC build.  verify_score.py's determinism check only proves the
  # renderer is reproducible ON ONE MACHINE.  These two jobs render a fixed
  # probe set on Linux/clang and macOS/AppleClang as well, and measure how far
  # the results are from the Windows reference.
  #
  # Bit identity across compilers is NOT expected: FMA contraction, libm
  # sin/exp/pow accuracy and vectorisation all legitimately differ, and
  # juce_recommended_lto_flags means the linker gets a say too.  So this is
  # deliberately a MEASUREMENT job, not a pass/fail gate: the comparator exits
  # 3 ("UNREGISTERED") when it finds differences and no approved tolerance
  # exists, and that is reported as a notice rather than a red build.  It
  # becomes a blocking gate the moment scores/crossplatform_tolerance.json is
  # created with limits approved into ROADMAP_PHYSICS.md section 6 (Rule 2:
  # an AI must not invent that tolerance).
  # ---------------------------------------------------------------------
  cross-platform-emit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-2022-msvc
          - os: ubuntu-24.04
            label: ubuntu-24.04-clang
          - os: macos-14
            label: macos-14-appleclang
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JUCE build dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Install numpy
        # The comparator deliberately depends on numpy only (no scipy), so it
        # runs on a bare runner without the full metrology requirement set.
        run: python -m pip install "numpy>=1.26"

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (CLI only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTSUKI_BUILD_TESTS=OFF

      - name: Build CLI
        run: cmake --build build --config Release --target TsukiSynthCLI

      - name: Render probe set
        run: >-
          python tools/crossplatform_verify.py
          --emit "xplat/${{ matrix.label }}"
          --label "${{ matrix.label }}"

      - name: Upload platform renders
        uses: actions/upload-artifact@v4
        with:
          name: xplat-${{ matrix.label }}
          path: xplat/${{ matrix.label }}
          retention-days: 14

  cross-platform-compare:
    needs: cross-platform-emit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Install numpy
        run: python -m pip install "numpy>=1.26"

      - name: Download every platform's renders
        uses: actions/download-artifact@v4
        with:
          path: xplat
          pattern: xplat-*

      - name: Compare against the Windows/MSVC reference
        # Windows is the reference by convention: every existing GATE
        # evidence file in reports/gate_outputs/ was produced there.
        # Exit codes: 0 bit-identical or within registered tolerance,
        # 1 out of registered tolerance, 2 inputs not comparable,
        # 3 differences measured but no tolerance registered yet.
        shell: bash
        run: |
          set +e
          python tools/crossplatform_verify.py --compare \
            xplat/xplat-windows-2022-msvc \
            xplat/xplat-ubuntu-24.04-clang \
            xplat/xplat-macos-14-appleclang | tee xplat_report.txt
          status=${PIPESTATUS[0]}
          set -e
          case "$status" in
            0) echo "::notice::Cross-platform renders agree (bit-identical or within registered tolerance)." ;;
            3) echo "::notice::Cross-platform differences measured; no tolerance registered yet (ROADMAP_PHYSICS.md section 6). Numbers are in the job log and the uploaded report." ;;
            *) echo "::error::Cross-platform comparison failed with exit $status"; exit "$status" ;;
          esac

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xplat-comparison-report
          path: xplat_report.txt
          retention-days: 14

  cpp-address-sanitizer:
    runs-on: windows-2022

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure AddressSanitizer regression build
        run: >-
          cmake -B build-asan
          -DTSUKI_BUILD_TESTS=ON
          -DTSUKI_ENABLE_SANITIZERS=ON

      - name: Build AddressSanitizer regression tests
        run: >-
          cmake --build build-asan --config RelWithDebInfo --target
          TsukiSynthAuditTest TsukiSynthTunerTest TsukiSynthPhysicsModelsTest

      - name: Run AddressSanitizer regression tests
        shell: pwsh
        run: ./tools/run_asan_ctest.ps1 -BuildDirectory build-asan -Configuration RelWithDebInfo
